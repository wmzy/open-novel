name: Eval Nightly

# P2 长程评测（docs/改进计划-内置Pi-SDK.md §7）：夜间跑 300 章一致性评测。
# 产物 JSON 随 artifact 上传；P0 命中率跌破 90% 等门槛失败时 job 直接红灯。
#
# LLM judge（可选）：仓库配置 PI_API_KEY secret（以及 PI_PROVIDER 等 variables）后，
# workflow 自动设置 EVAL_JUDGE=1；未配置时保持跳过，不影响确定性评测。
# 推荐用仓库 variable EVAL_JUDGE_MODEL 指定便宜模型（如 gpt-4.1-mini），
# 避免 judge 与写作共用昂贵模型。凭据只注入 eval 进程，不写 DB/日志。
# 注意：judge 模型必须存在于该 provider 的模型目录中——自定义 provider
# 只注册 PI_MODEL 一个模型，此时 EVAL_JUDGE_MODEL 需与 PI_MODEL 相同。
on:
  schedule:
    - cron: '0 19 * * *' # UTC 19:00 = 北京时间次日 03:00
  workflow_dispatch:
    inputs:
      chapters:
        description: '评测章节数（默认 300）'
        required: false
        default: '300'

permissions:
  contents: read

jobs:
  consistency-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EVAL_CHAPTERS: ${{ inputs.chapters || '300' }}
      # secrets 不能直接出现在 if: 中；这里用表达式合成 0/1，测试侧只认 '1'。
      EVAL_JUDGE: ${{ (secrets.PI_API_KEY != '' || vars.PI_BASE_URL != '') && '1' || '0' }}
      EVAL_JUDGE_MODEL: ${{ vars.EVAL_JUDGE_MODEL }}
      PI_PROVIDER: ${{ vars.PI_PROVIDER }}
      PI_MODEL: ${{ vars.PI_MODEL }}
      PI_BASE_URL: ${{ vars.PI_BASE_URL }}
      PI_API: ${{ vars.PI_API }}
      PI_API_KEY: ${{ secrets.PI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 长程一致性评测
        run: node scripts/eval-consistency.mjs

      - name: 上传评测结果 JSON
        if: always() # 失败时也上传产物，便于诊断命中率/性能数字
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: tests/eval/results/*.json
          if-no-files-found: warn
